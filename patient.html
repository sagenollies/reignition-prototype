<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reignition — Patient Link</title>
<style>
  :root {
    --teal: #1e4e4d;
    --orange: #c45e22;
    --cream: #e9ebea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, #2a5453, #0f2a2a 70%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #eee;
    padding: 28px 16px 60px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  .subtitle {
    color: #a9c3c1;
    font-size: 13px;
    margin-bottom: 22px;
    text-align: center;
    max-width: 480px;
  }
  .stage {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  .phone-wrap {
    position: relative;
  }
  .phone {
    --pw: min(340px, calc(100vw - 32px), calc((100vh - 250px) * 340 / 756));
    width: var(--pw);
    height: calc(var(--pw) * 756 / 340);
    border-radius: calc(var(--pw) * 0.135);
    background: #000;
    padding: calc(var(--pw) * 0.035);
    box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 2px #333;
    position: relative;
  }
  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: calc(var(--pw) * 0.106);
    overflow: hidden;
    background: var(--teal);
  }
  .screen img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
  }
  .hotspot {
    position: absolute;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) {
    .hotspot:hover {
      background: rgba(255,255,255,0.08);
      outline: 1px dashed rgba(255,255,255,0.4);
    }
  }
  .hotspot:active {
    background: rgba(255,255,255,0.16);
    outline: 1px dashed rgba(255,255,255,0.5);
  }
  .notch {
    position: absolute;
    top: 12px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 24px;
    background: #000;
    border-radius: 14px;
    z-index: 5;
    opacity: 0;
  }
  .controls {
    margin-top: 18px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 340px;
  }
  button.ctl {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: #eee;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
  }
  button.ctl:hover { background: rgba(255,255,255,0.16); }
  button.ctl:disabled { opacity: 0.35; cursor: default; }

  .panel {
    width: 300px;
    max-height: 756px;
    overflow-y: auto;
    background: rgba(15,35,35,0.6);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 16px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #8fb3b1;
    margin: 18px 0 8px;
  }
  .panel h2:first-child { margin-top: 0; }
  .screen-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: #dfeceb;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 13.5px;
    cursor: pointer;
    margin-bottom: 2px;
  }
  .screen-btn:hover { background: rgba(255,255,255,0.08); }
  .screen-btn.active { background: var(--orange); color: white; font-weight: 600; }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }
  .brand svg { display: block; }
  .brand-logo { height: 30px; display: block; }
  .brand .sep { font-size: 20px; font-weight: 700; color: #eee; }

  .hint {
    font-size: 11px;
    color: #7fa4a2;
    margin-top: 14px;
    text-align: center;
    max-width: 340px;
  }

  /* Screen list is an always-open disclosure on desktop, collapsible on phones */
  .panel-wrap > summary { display: none; }

  @supports (height: 100dvh) {
    .phone {
      --pw: min(340px, calc(100vw - 32px), calc((100dvh - 250px) * 340 / 756));
    }
  }

  @media (max-width: 780px) {
    body { padding: 14px 12px 40px; }
    h1 { font-size: 16px; }
    .brand-logo { height: 24px; }
    .brand { gap: 9px; }
    .subtitle { font-size: 12px; margin-bottom: 14px; }
    .stage { gap: 14px; width: 100%; }
    .controls { margin-top: 12px; max-width: none; }
    .hint { max-width: 320px; }

    .panel-wrap {
      width: 100%;
      max-width: 420px;
      background: rgba(15,35,35,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
    }
    .panel-wrap > summary {
      display: block;
      list-style: none;
      cursor: pointer;
      padding: 13px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #dfeceb;
    }
    .panel-wrap > summary::-webkit-details-marker { display: none; }
    .panel-wrap > summary::after {
      content: " ▾";
      color: #8fb3b1;
    }
    .panel-wrap[open] > summary::after { content: " ▴"; }
    .panel {
      width: 100%;
      max-height: 46vh;
      background: none;
      border: none;
      border-radius: 0;
      padding: 0 10px 12px;
    }
    .screen-btn { padding: 10px 10px; font-size: 14px; }
  }
</style>
</head>

  <h1><span class="sep">— Patient Link</span></h1>

<div class="subtitle">What a patient sees after tapping the link texted from the EMR. Tap through it like a real patient.</div>

<div class="stage">
  <div>
    <div class="phone-wrap">
      <div class="phone">
        <div class="screen" id="screen">
          <img id="screen-img" src="" alt="">
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="ctl" id="btn-back" onclick="goBack()">← Back</button>
      <button class="ctl" id="btn-home" onclick="goHome()">↺ Restart</button>
      <span class="ctl" id="screen-name" style="cursor:default;"></span>
    </div>
    <div class="hint">Tap the buttons and cards to move through the flow.</div>
  </div>

  <details class="panel-wrap" id="panel-wrap" open>
    <summary>All screens</summary>
    <div class="panel" id="panel"></div>
  </details>

const ORDER = ["p_welcome", "p_share_both", "p_share_both_on", "p_share_note", "p_preparing", "p_review_summary", "p_stood_out", "p_stood_out_sel", "p_write_empty", "p_write_filled", "p_speak", "p_ready_generating", "p_ready_full", "p_ready_expanded", "p_ember", "p_cancel", "p_thankyou"];

let history_stack = ['p_welcome'];

function currentScreen() {
  return history_stack[history_stack.length - 1];
}

function render() {
  const name = currentScreen();
  const s = SCREENS[name];
  document.getElementById('screen-img').src = 'data:image/webp;base64,' + IMAGES[name];
  document.getElementById('screen-name').textContent = s.label;
  document.getElementById('btn-back').disabled = history_stack.length <= 1;

  const screenEl = document.getElementById('screen');
  screenEl.querySelectorAll('.hotspot').forEach(el => el.remove());
  s.hotspots.forEach(hs => {
    const el = document.createElement('div');
    el.className = 'hotspot';
    el.style.left = (hs.x / 393 * 100) + '%';
    el.style.top = (hs.y / 874 * 100) + '%';
    el.style.width = (hs.w / 393 * 100) + '%';
    el.style.height = (hs.h / 874 * 100) + '%';
    el.onclick = () => {
      if (hs.action === 'goto') {
        history_stack.push(hs.target);
      } else if (hs.action === 'back') {
        goBack();
        return;
      }
      render();
    };
    screenEl.appendChild(el);
  });

  document.querySelectorAll('.screen-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.name === name);
  });
}

function goBack() {
  if (history_stack.length > 1) history_stack.pop();
  render();
}
function goHome() {
  history_stack = ['p_welcome'];
  render();
}
function jump(name) {
  history_stack.push(name);
  render();
  // On phones the screen list sits below the device, so bring the phone back into view
  if (window.matchMedia('(max-width: 780px)').matches) {
    document.querySelector('.phone-wrap').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function buildPanel() {
  const panel = document.getElementById('panel');
  const groups = {};
  ORDER.forEach(name => {
    const g = SCREENS[name].group;
    if (!groups[g]) groups[g] = [];
    groups[g].push(name);
  });
  Object.keys(groups).forEach(g => {
    const h2 = document.createElement('h2');
    h2.textContent = g;
    panel.appendChild(h2);
    groups[g].forEach(name => {
      const b = document.createElement('button');
      b.className = 'screen-btn';
      b.dataset.name = name;
      b.textContent = SCREENS[name].label;
      b.onclick = () => jump(name);
      panel.appendChild(b);
    });
  });
}

buildPanel();
render();

// Start with the screen list collapsed on phones so the device fills the viewport
if (window.matchMedia('(max-width: 780px)').matches) {
  document.getElementById('panel-wrap').open = false;
}
</script>
